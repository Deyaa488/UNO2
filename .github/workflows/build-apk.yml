name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Initialize & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Creating Android platform with Capacitor..."
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Embedded Java WebSocket & NSD LAN Plugin
        run: |
          echo "Copying Native UnoLanBridgePlugin and UnoWebSocketServer..."
          DEST_JAVA="android/app/src/main/java/com/uno3d/lan"
          mkdir -p "$DEST_JAVA"
          cp android-plugin/*.java "$DEST_JAVA/"

          echo "Adding Java-WebSocket dependency to android/app/build.gradle..."
          GRADLE_FILE="android/app/build.gradle"
          if ! grep -q "Java-WebSocket" "$GRADLE_FILE"; then
            sed -i '/dependencies {/a \    implementation "org.java-websocket:Java-WebSocket:1.5.6"' "$GRADLE_FILE"
          fi

          echo "Adding Network & Multicast permissions to AndroidManifest.xml..."
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "CHANGE_WIFI_MULTICAST_STATE" "$MANIFEST"; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
          fi

          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            echo "Patching AndroidManifest.xml to allow cleartext LAN traffic..."
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uno-3d-lan-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
