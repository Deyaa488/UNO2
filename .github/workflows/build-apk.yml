name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Initialize & Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Creating Android platform with Capacitor..."
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Embedded Java WebSocket & NSD LAN Plugin
        run: |
          echo "Copying Native UnoLanBridgePlugin and UnoWebSocketServer..."
          DEST_JAVA="android/app/src/main/java/com/uno3d/lan"
          mkdir -p "$DEST_JAVA"
          cp android-plugin/*.java "$DEST_JAVA/"

          echo "Configuring build.gradle and AndroidManifest.xml via Python..."
          python3 -c '
          # 1. Patch android/app/build.gradle
          with open("android/app/build.gradle", "r") as f:
              content = f.read()
          if "Java-WebSocket" not in content:
              content = content.replace("dependencies {", "dependencies {\n    implementation \"org.java-websocket:Java-WebSocket:1.5.6\"")
              with open("android/app/build.gradle", "w") as f:
                  f.write(content)

          # 2. Patch AndroidManifest.xml
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              manifest = f.read()
          if "CHANGE_WIFI_MULTICAST_STATE" not in manifest:
              perms = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
          </manifest>"""
              manifest = manifest.replace("</manifest>", perms)
          if "usesCleartextTraffic" not in manifest:
              manifest = manifest.replace("<application", "<application android:usesCleartextTraffic=\"true\"")
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)
          '

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uno-3d-lan-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
